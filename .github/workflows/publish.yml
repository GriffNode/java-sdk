name: publish
# Maven Central needs a Sonatype Central Portal account (namespace com.griffnode) + a published
# GPG key before this can run for real. Add the four secrets below in the repo settings, then
# this fires on the next GitHub Release. See docs/sdk/RELEASING.md.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  maven-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to Maven Central
        run: mvn -B -DskipTests deploy -P release
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USER }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
