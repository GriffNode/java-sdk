name: Generate SDK
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['openapi.yaml', 'openapi-config.yaml', 'openapitools.json', '.github/workflows/generate.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate (java)
        run: |
          docker run --rm -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.10.0 \
            generate -i /local/openapi.yaml -g java -o /local \
            --skip-validate-spec \
            -c /local/openapi-config.yaml
      # openapi-generator's java template has no config option for custom Maven profiles/
      # plugins, so the regenerated pom.xml always resets the release profile to the
      # generator's own default (id "sign-artifacts", no deploy plugin) — this reapplies the
      # real release profile (central-publishing-maven-plugin) every time. Exact string
      # match on purpose: if the generator's default block ever changes shape, this should
      # fail loudly instead of silently doing nothing.
      - name: Fix pom.xml release profile
        run: python3 .github/scripts/fix-release-profile.py
      - name: Commit regenerated SDK
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: regenerate SDK from openapi.yaml"
          git pull --rebase --autostash
          git push
